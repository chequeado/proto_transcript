services:
  proto:
    build: .
    image: proto-transcript
    env_file: .env
    # recoge los procesos hijos (yt-dlp, ffmpeg) que mueren en cada reinicio de la descarga
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # sólo localhost: la web no tiene login
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
