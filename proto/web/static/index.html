<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proto_transcript</title>
<style>
  :root {
    --bg: #fafaf9; --panel: #ffffff; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4;
    --accent: #2563eb; --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
    font-family: system-ui, sans-serif; color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --panel: #1c1917; --fg: #e7e5e4; --muted: #a8a29e; --line: #292524; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); }
  header { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; }
  input, select, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
  input[type=url] { flex: 1; min-width: 240px; }
  #keyterms { flex: 1; min-width: 200px; }
  #prompt { flex: 2; min-width: 280px; }
  .col .spk { font-weight: 600; color: var(--accent); margin-right: 6px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px; height: calc(100vh - 60px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; overflow: auto; min-height: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  #columns { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; gap: 16px; }
  @media (max-width: 900px) { #columns { grid-auto-flow: row; } }
  .col h3 { font-size: 13px; margin: 0 0 8px; color: var(--accent); }
  .col p { margin: 0 0 10px; line-height: 1.5; }
  .col time { color: var(--muted); font-size: 12px; margin-right: 8px; font-variant-numeric: tabular-nums; }
  .col .partial { color: var(--muted); font-style: italic; }
  .engines { display: flex; gap: 10px; font-size: 14px; }
  aside { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  #status { font-size: 13px; }
  #status dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
  #status dt { color: var(--muted); }
  #status dd { margin: 0; overflow-wrap: anywhere; }
  #events { flex: 1; font: 12px ui-monospace, monospace; }
  #events div { white-space: pre-wrap; padding: 2px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .k-ingest_exit, .k-stt_error, .k-stt_fatal, .k-stt_closed { color: var(--bad); }
  .k-ingest_first_audio, .k-stt_begin, .k-stt_language { color: var(--ok); }
  .k-heartbeat { color: var(--muted); }
  .k-ingest_restart_wait, .k-stt_reconnect_wait, .k-stt_warning { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>proto_transcript</h1>
  <input id="url" type="url" placeholder="URL del vivo (YouTube u otro)">
  <span class="engines">
    <label><input type="checkbox" name="stt" value="assemblyai" checked> AssemblyAI</label>
    <label><input type="checkbox" name="stt" value="null"> null</label>
    <label title="+US$0,12/h"><input type="checkbox" id="speakers"> separar hablantes</label>
  </span>
  <input id="prompt" type="text" placeholder="contexto (opcional): Entrevista radial con un dirigente peronista sobre Milei y política nuclear">
  <input id="keyterms" type="text" placeholder="keyterms (opcional): Milei, ARSAT, Pilcaniyeu">

  <button class="primary" id="start">Empezar</button>
  <select id="sessions"><option value="">— sesiones —</option></select>
  <button id="stop">Parar</button>
</header>
<main>
  <section id="transcript"><h2>Transcripción</h2><div id="columns"></div></section>
  <aside>
    <section id="status"><h2>Estado</h2><dl></dl></section>
    <section id="events"><h2>Eventos</h2><div id="eventlist"></div></section>
  </aside>
</main>
<script>
const $ = (s) => document.querySelector(s);
let ws = null, current = null, pollTimer = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json();
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

async function refreshList() {
  const list = await api('/api/sessions');
  const sel = $('#sessions');
  sel.innerHTML = '<option value="">— sesiones —</option>' + list.map(s =>
    `<option value="${s.id}">${s.running ? '● ' : ''}${s.id} (${s.stt})</option>`).join('');
  if (current) sel.value = current;
}

function renderStatus(s) {
  const fmt = (v) => typeof v === 'object' && v !== null ? JSON.stringify(v) : v;
  const keys = ['running', 'prompt', 'keyterms', 'speakers', 'ingest_state', 'ended_reason', 'error', 'video_url', 'wall_s', 'audio_s', 'coverage', 'speed',
                'proxy_mode', 'proxy', 'runs', 'exit_reasons', 'last_audio_ago_s', 'finals', 'stt_queue', 'engines'];
  $('#status dl').innerHTML = keys.map(k => `<dt>${k}</dt><dd>${fmt(s[k]) ?? '—'}</dd>`).join('');
}

function column(engine) {
  let col = document.getElementById('col-' + engine);
  if (!col) {
    col = document.createElement('div');
    col.className = 'col';
    col.id = 'col-' + engine;
    col.innerHTML = `<h3>${engine}</h3><div class="finals"></div><p class="partial"></p>`;
    $('#columns').appendChild(col);
  }
  return col;
}

function addFinal(f) {
  const col = column(f.engine);
  const id = 'f-' + f.engine + '-' + f.key;
  let p = document.getElementById(id);
  if (!p) {
    p = document.createElement('p');
    p.id = id;
    col.querySelector('.finals').appendChild(p);
  }
  col.querySelector('.partial').textContent = '';
  const t = new Date(f.ts).toLocaleTimeString();
  p.innerHTML = `<time>${t}</time>`;
  const segments = (f.extra || {}).segments;
  if (!segments) { p.appendChild(document.createTextNode(f.text)); return; }
  segments.forEach((s, i) => {
    if (i) p.appendChild(document.createElement('br'));
    const spk = document.createElement('span');
    spk.className = 'spk';
    spk.textContent = s.speaker;
    p.append(spk, document.createTextNode(s.text));
  });
}

function addEvent(e) {
  if (!e.msg) return;
  const d = document.createElement('div');
  d.className = 'k-' + e.kind;
  d.textContent = `${new Date(e.ts).toLocaleTimeString()} ${e.msg.trim()}`;
  const list = $('#eventlist');
  list.prepend(d);
  while (list.children.length > 300) list.lastChild.remove();
}

function scrollDown() {
  const sec = $('#transcript');
  if (sec.scrollHeight - sec.scrollTop - sec.clientHeight < 120) sec.scrollTop = sec.scrollHeight;
}

function open(id) {
  if (ws) ws.close();
  clearInterval(pollTimer);
  current = id;
  $('#columns').innerHTML = ''; $('#eventlist').innerHTML = '';
  if (!id) return;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/sessions/${id}`);
  ws.onmessage = (m) => {
    const msg = JSON.parse(m.data);
    if (msg.type === 'history') {
      msg.status.stt.split(',').filter(e => e !== 'null').forEach(column);
      msg.finals.forEach(addFinal); msg.events.forEach(addEvent); renderStatus(msg.status);
    } else if (msg.type === 'partial') {
      column(msg.engine).querySelector('.partial').textContent = msg.text;
    } else if (msg.type === 'final') {
      addFinal(msg);
    } else if (msg.type === 'event') {
      addEvent(msg.event);
    } else if (msg.type === 'status') {
      renderStatus(msg.status); refreshList();
    }
    scrollDown();
  };
  pollTimer = setInterval(async () => renderStatus(await api(`/api/sessions/${id}`)), 5000);
}

$('#start').onclick = async () => {
  const url = $('#url').value.trim();
  if (!url) return;
  try {
    const s = await api('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                           body: JSON.stringify({ url, stt: [...document.querySelectorAll('input[name=stt]:checked')].map(c => c.value).join(','),
                                                                  prompt: $('#prompt').value, keyterms: $('#keyterms').value,
                                                                  speakers: $('#speakers').checked }) });
    current = s.id; await refreshList(); open(s.id);
  } catch (e) { alert(e.message); }
};
$('#stop').onclick = async () => {
  if (!current) return;
  $('#stop').disabled = true;
  try { renderStatus(await api(`/api/sessions/${current}`, { method: 'DELETE' })); await refreshList(); }
  finally { $('#stop').disabled = false; }
};
$('#sessions').onchange = (e) => open(e.target.value);
refreshList();
</script>
</body>
</html>
