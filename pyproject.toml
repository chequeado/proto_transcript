[project]
name = "proto-transcript"
version = "0.1.0"
description = "Prototipo de transcriptor en vivo: yt-dlp -> ffmpeg -> STT en streaming"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets>=14",
    "pydantic-settings",
    "yt-dlp[default]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proto*"]

[tool.setuptools.package-data]
"proto.web" = ["static/*"]
